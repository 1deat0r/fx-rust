[package]
name = "fxrs"
version = "0.1.0"
edition = "2021"
description = "fxrs — a Rust port of fx (Vercel Labs' fx coding agent): a tiny, open, model-agnostic terminal coding agent."
license = "Apache-2.0"

[[bin]]
name = "fxrs"
path = "src/main.rs"

[lib]
name = "fxrs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
regex = "1"
globset = "0.4"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
rustyline = "15"
futures-util = "0.3"
shell-words = "1"
async-stream = "0.3"
